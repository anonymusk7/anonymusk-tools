<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Token → 15s launch clip | anonymusk</title><link rel=stylesheet href=style.css><script src=common.js></script><main><h1>🚀 Token → 15s launch clip</h1><p class=muted>CoinGecko id (e.g. <code>pepe</code>), symbol, or contract address (DexScreener). Live data, rendered in your browser.</p>
<div class=row><input id=q value=pepe size=40><button id=go>Load</button><button id=rec disabled>Download 15s .webm</button></div><div id=st class=muted></div><canvas id=cv width=1080 height=1080></canvas></main>
<script>
const cv=document.getElementById('cv'),st=document.getElementById('st');let D=null,stop=null;
async function j(u){const r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()}
async function load(q){q=q.trim();
 if(/^0x[a-fA-F0-9]{40}$/.test(q)||/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(q)){const d=await j('https://api.dexscreener.com/latest/dex/tokens/'+q);return fromPair(d.pairs)}
 try{const c=await j('https://api.coingecko.com/api/v3/coins/'+encodeURIComponent(q.toLowerCase())+'?localization=false&tickers=false&community_data=false&developer_data=false&sparkline=true');const m=c.market_data;return{name:c.name,sym:c.symbol.toUpperCase(),price:m.current_price.usd,mcap:m.market_cap.usd||m.fully_diluted_valuation.usd,vol:m.total_volume.usd,ch:m.price_change_percentage_24h,spark:(m.sparkline_7d||{}).price||[],img:c.image.large,src:'CoinGecko'}}catch(e){}
 const d=await j('https://api.dexscreener.com/latest/dex/search?q='+encodeURIComponent(q));return fromPair(d.pairs)}
function fromPair(ps){if(!ps||!ps.length)throw Error('not found');const p=ps.sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0))[0];const pr=+p.priceUsd,c=p.priceChange||{};
 // synthesize a path from the change windows (DexScreener gives no candles)
 const pts=[[0,c.h24],[18,c.h6],[23,c.h1],[23.9,c.m5],[24,0]].filter(x=>x[1]!=null).map(([h,v])=>[h,pr/(1+v/100)]);pts.push([24,pr]);
 const spark=[];for(let i=0;i<=48;i++){const h=i/2;let k=pts.findIndex(p=>p[0]>=h);if(k<=0){spark.push(pts[0][1]);continue}const a=pts[k-1],b=pts[k],u=(h-a[0])/(b[0]-a[0]||1);spark.push(a[1]+(b[1]-a[1])*u*(1+.04*Math.sin(i*1.7)))}
 return{name:p.baseToken.name,sym:p.baseToken.symbol,price:pr,mcap:p.marketCap||p.fdv,vol:p.volume?.h24,ch:c.h24,spark,img:p.info?.imageUrl,src:'DexScreener · '+p.chainId+'/'+p.dexId}}
let IMG=null;
function draw(c,t){const W=1080,H=1080;const up=(D.ch||0)>=0,hue=up?150:350;bg(c,t,W,H,hue);const acc=up?'#5dffb0':'#ff5d7a';
 const a1=ease(t/1.2);if(IMG&&IMG.complete&&IMG.naturalWidth){c.save();c.globalAlpha=a1;c.beginPath();c.arc(W/2,190,90*a1,0,7);c.clip();c.drawImage(IMG,W/2-90,100,180,180);c.restore()}
 txt(c,'$'+D.sym,W/2,360,110*(0.6+0.4*a1),'#fff','center',a1);txt(c,D.name,W/2,415,36,'#9fb','center',a1);
 const rows=[['PRICE','$'+fmt(D.price*ease((t-2)/2.5)),2],['MARKET CAP','$'+fmt(D.mcap*ease((t-3.5)/2.5)),3.5],['24H VOLUME','$'+fmt(D.vol*ease((t-5)/2.5)),5]];
 rows.forEach(([k,v,s],i)=>{const a=ease((t-s)/.6),y=520+i*110;txt(c,k,140-40*(1-a),y,30,'#8a9','left',a);txt(c,v,W-140+40*(1-a),y,64,'#fff','right',a)});
 const ca=ease((t-6.5)/.6);txt(c,(up?'▲ ':'▼ ')+Math.abs(D.ch||0).toFixed(2)+'% 24h',W/2,880,60,acc,'center',ca);
 // chart
 const s=D.spark;if(s&&s.length>2&&t>7.5){const p=ease((t-7.5)/4),mn=Math.min(...s),mx=Math.max(...s),n=Math.floor(s.length*p);c.strokeStyle=acc;c.lineWidth=6;c.globalAlpha=.9;c.beginPath();for(let i=0;i<n;i++){const x=100+i/(s.length-1)*(W-200),y=1000-(s[i]-mn)/(mx-mn||1)*90;i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();c.globalAlpha=1}
 if(t>12.5){const a=ease((t-12.5)/.8);c.fillStyle=`rgba(0,0,0,${.75*a})`;c.fillRect(0,0,W,H);txt(c,'$'+D.sym,W/2,480,140,acc,'center',a);txt(c,'LIVE · '+new Date().toISOString().slice(0,10),W/2,560,36,'#fff','center',a)}
 txt(c,'data: '+D.src,30,H-30,18,'rgba(255,255,255,.35)','left');wm(c,W,H)}
async function go(){st.textContent='loading…';try{D=await load(q.value);IMG=null;if(D.img){IMG=new Image();IMG.crossOrigin='anonymous';IMG.onerror=()=>IMG=null;IMG.src=D.img}st.textContent=D.name+' loaded from '+D.src;stop&&stop();stop=loop(cv,draw,15);rec.disabled=false}catch(e){st.textContent='Could not find token ('+e.message+'). Try a contract address.'}}
if(location.hash)q.value=decodeURIComponent(location.hash.slice(1));document.getElementById("go").onclick=go;rec.onclick=()=>{stop&&stop();recordCanvas(cv,draw,15,D.sym+'-launch',rec)};go();
</script>
