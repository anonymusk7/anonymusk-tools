<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Bookmark brain | anonymusk</title><link rel=stylesheet href=style.css><script src=common.js></script><script src=parse.js></script><main><h1>🧠 Bookmark brain</h1><p class=muted>Load your X bookmarks (bookmark.js, JSON export, or categorized CSV). Auto-sorts by topic, full-text search, and surfaces forgotten gems. 100% local.</p>
<div class=row><input type=file id=f accept=".js,.json,.csv"><input id=s placeholder="search…" size=30><select id=c><option value="">all categories</option></select><button id=gem>✨ Forgotten gems</button><button id=dl>Export CSV</button></div><div id=st class=muted>No file loaded.</div><div id=out></div></main>
<script>
let I=[];const esc=s=>(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function render(list,title){out.innerHTML=(title?`<h3>${title}</h3>`:'')+list.slice(0,300).map(i=>`<div class=card><span class=muted>${i.cat} · ${i.author||''} · ${i.date?i.date.toISOString().slice(0,10):''}</span><br>${esc(i.text).slice(0,400)||'<i>(media only)</i>'} <a href="${i.url}" target=_blank>open ↗</a></div>`).join('')+(list.length>300?`<p class=muted>+${list.length-300} more — refine search</p>`:'')}
function filt(){const q=s.value.toLowerCase(),cc=c.value;const l=I.filter(i=>(!cc||i.cat==cc)&&(!q||(i.text+' '+i.author).toLowerCase().includes(q)));st.textContent=l.length+' / '+I.length+' bookmarks';render(l)}
f.onchange=async()=>{try{I=parseAny(await f.files[0].text());const cs={};I.forEach(i=>cs[i.cat]=(cs[i.cat]||0)+1);c.innerHTML='<option value="">all categories</option>'+Object.entries(cs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<option value="${esc(k)}">${esc(k)} (${v})</option>`).join('');filt()}catch(e){st.textContent='parse error: '+e.message}};
s.oninput=c.onchange=filt;
gem.onclick=()=>{const now=Date.now();const g=I.filter(i=>i.date&&now-i.date>180*864e5&&(i.text||'').length>80&&/(how|guide|thread|tool|github|free|prompt|step|learn|\d+ )/i.test(i.text)).sort(()=>Math.random()-.5).slice(0,12);render(g,'✨ 12 forgotten gems (6+ months old, high-signal) — shuffle again for more')};
dl.onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='url,date,author,category,text\n'+I.map(i=>[i.url,i.date?i.date.toISOString().slice(0,10):'',i.author,i.cat,i.text].map(q).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv]));a.download='bookmarks-sorted.csv';a.click()};
</script>
