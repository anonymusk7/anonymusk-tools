<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><title>AI agent token leaderboard | anonymusk</title><link rel=stylesheet href=style.css><script src=common.js></script><main><h1>🤖 AI agent leaderboard</h1><p class=muted>Top AI-agent tokens ranked by 24h on-chain/exchange volume (CoinGecko "AI Agents" category, free API, live). <b>Note:</b> true per-agent <i>earnings</i> (fees/revenue) have no free, keyless, CORS-friendly source yet — this ranks market activity as the closest public proxy.</p>
<div class=row><select id=o><option value=volume_desc>by 24h volume</option><option value=market_cap_desc>by market cap</option></select></div><table id=t style="width:100%;border-collapse:collapse"></table></main>
<script>
async function load(){t.innerHTML='<tr><td>loading…</td></tr>';try{const d=await (await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&category=ai-agents&per_page=50&order='+o.value)).json();
t.innerHTML='<tr class=muted><th align=left>#</th><th align=left>agent</th><th align=right>price</th><th align=right>24h</th><th align=right>vol 24h</th><th align=right>mcap</th><th></th></tr>'+d.map((c,i)=>`<tr style="border-top:1px solid #1d2a22"><td>${i+1}</td><td><img src="${c.image}" width=20 style="vertical-align:middle"> ${c.name} <span class=muted>${c.symbol.toUpperCase()}</span></td><td align=right>$${fmt(c.current_price)}</td><td align=right style="color:${c.price_change_percentage_24h>=0?'#5dffb0':'#ff5d7a'}">${(c.price_change_percentage_24h||0).toFixed(1)}%</td><td align=right>$${fmt(c.total_volume)}</td><td align=right>$${fmt(c.market_cap)}</td><td><a href="launch.html#${c.id}">clip →</a></td></tr>`).join('')}catch(e){t.innerHTML='<tr><td>CoinGecko rate limit hit — retry in a minute.</td></tr>'}}
o.onchange=load;load();
</script>
